name: Temporary delayed Gateway probe
on:
  push:
    paths:
      - "docs/SECURITY_MODEL.md"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Allow Gateway policy propagation
        run: sleep 75
      - name: Invoke fixed diagnostic
        run: node -e "fetch('https://secops-egress-check.buttercoder-dev.workers.dev/verify-65a6b9c1-d330-45a7-b13d-e7200b171057').then(async r => { console.log(r.status, await r.text()); if (!r.ok) process.exit(1); })"
