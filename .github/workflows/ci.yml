name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Live Cloudflare deployment smoke test
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import vm from "node:vm";

          const base = "https://security-assessment-alpha.buttercoder-dev.workers.dev";
          const [healthResponse, pageResponse] = await Promise.all([
            fetch(base + "/api/health", { signal: AbortSignal.timeout(15000) }),
            fetch(base + "/", { signal: AbortSignal.timeout(15000) })
          ]);

          assert.equal(healthResponse.status, 200, "live health endpoint must return 200");
          assert.deepEqual(await healthResponse.json(), {
            ok: true,
            service: "security-assessment-alpha",
            mode: "passive-only",
            scanner_state: "paused",
            egress: "gateway-vpc"
          });

          assert.equal(pageResponse.status, 200, "live dashboard must return 200");
          const html = await pageResponse.text();
          const csp = pageResponse.headers.get("content-security-policy") || "";
          const nonce = csp.match(/script-src 'self' 'nonce-([^']+)'/)?.[1];
          assert.ok(nonce, "live CSP must include a script nonce");
          assert.ok(html.includes('<script nonce="' + nonce + '">'), "live script must carry the CSP nonce");
          assert.ok(!csp.includes("unsafe-inline"), "live CSP must not allow unsafe inline scripts");
          for (const id of ["targets", "scans", "assets", "findings"]) {
            assert.ok(html.includes('id="' + id + '"'), "live dashboard is missing #" + id);
          }
          for (const feature of ["Assessment history", "Discovered assets", "Discover assets", "Check DNS"]) {
            assert.ok(html.includes(feature), "live dashboard is missing " + feature);
          }
          const scriptStart = html.indexOf('<script nonce="' + nonce + '">');
          const bodyStart = html.indexOf(">", scriptStart) + 1;
          const scriptEnd = html.indexOf("</script>", bodyStart);
          assert.ok(scriptStart >= 0 && scriptEnd > bodyStart, "live dashboard script must be present");
          assert.doesNotThrow(() => new vm.Script(html.slice(bodyStart, scriptEnd)), "live dashboard JavaScript must parse");
          console.log("Live Cloudflare health and dashboard smoke tests passed.");
          NODE

      - name: Live anonymous workspace API lifecycle
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";

          const base = "https://security-assessment-alpha.buttercoder-dev.workers.dev";
          const session = await fetch(base + "/api/session", { signal: AbortSignal.timeout(15000) });
          assert.equal(session.status, 200, "anonymous session must be created without account signup");
          const setCookie = session.headers.get("set-cookie");
          assert.ok(setCookie, "new anonymous workspace must receive a browser-bound cookie");
          const cookie = setCookie.split(";")[0];
          const headers = { cookie, origin: base, "content-type": "application/json" };

          for (const path of ["/api/targets", "/api/assets", "/api/scans", "/api/overview"]) {
            const response = await fetch(base + path, { headers: { cookie } });
            assert.equal(response.status, 200, path + " must be available to an anonymous workspace");
          }

          const invalid = await fetch(base + "/api/targets", {
            method: "POST", headers, body: JSON.stringify({ url: "http://example.org" })
          });
          assert.equal(invalid.status, 400, "HTTP targets must be rejected");

          const targetResponse = await fetch(base + "/api/targets", {
            method: "POST",
            headers,
            body: JSON.stringify({ url: "https://e2e-" + Date.now() + ".example.org" })
          });
          assert.equal(targetResponse.status, 201, "anonymous user must be able to register an HTTPS target");
          const target = await targetResponse.json();
          assert.ok(target.id && target.verification_token, "registration must return the DNS ownership challenge");

          const duplicate = await fetch(base + "/api/targets", {
            method: "POST", headers, body: JSON.stringify({ url: "https://" + target.hostname })
          });
          assert.equal(duplicate.status, 409, "duplicate targets must be rejected");

          const unverifiedScan = await fetch(base + "/api/targets/" + target.id + "/scan", {
            method: "POST", headers, body: "{}"
          });
          assert.equal(unverifiedScan.status, 403, "unverified targets must never be scanned");

          const deletion = await fetch(base + "/api/targets/" + target.id, {
            method: "DELETE", headers
          });
          assert.equal(deletion.status, 200, "workspace owner must be able to delete the test target");

          const after = await fetch(base + "/api/targets", { headers: { cookie } });
          assert.equal(after.status, 200);
          const remaining = await after.json();
          assert.equal((remaining.targets || []).some(item => item.id === target.id), false,
            "deleted test target must no longer appear in the workspace");
          console.log("Live anonymous workspace lifecycle passed.");
          NODE
