name: Temporary VPC egress isolation probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  egress-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe dedicated VPC and account-default network
        env:
          PROBE_URL: https://secops-egress-probe.buttercoder-dev.workers.dev/probe-fd5ef3b2-e278-4729-9c4e-f11d9eaef804
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const response = await fetch(process.env.PROBE_URL, { signal: AbortSignal.timeout(45000) });
          const text = await response.text();
          assert.equal(response.status, 200, "probe Worker must return HTTP 200: " + text.slice(0, 1000));
          const data = JSON.parse(text);
          console.log(JSON.stringify(data, null, 2));
          for (const bindingName of ["custom_vnet", "default_network"]) {
            const results = data.results[bindingName];
            assert.ok(results, bindingName + " results must exist");
            const pub = results.public_https;
            assert.equal(pub.outcome, "response", bindingName + " must reach public HTTPS: " + JSON.stringify(pub));
            assert.ok(pub.status >= 200 && pub.status < 400, bindingName + " public HTTPS status must be successful");
            for (const key of ["loopback_ipv4", "private_ipv4", "loopback_ipv6", "dns_private_ipv4", "dns_private_10_ipv4"]) {
              assert.equal(results[key].outcome, "blocked_or_unavailable", bindingName + " must not reach " + key + ": " + JSON.stringify(results[key]));
            }
          }
          console.log("VPC public egress and private-destination blocking checks passed.");
          NODE
