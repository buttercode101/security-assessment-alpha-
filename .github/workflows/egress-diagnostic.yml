name: Temporary egress diagnostic (one-shot verification)
on:
  push:
    paths:
      - ".github/workflows/egress-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invoke-fixed-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Invoke fixed-destination Cloudflare diagnostic
        run: |
          set -eu
          curl --fail-with-body --silent --show-error --max-time 70 \
            "https://secops-egress-check.buttercoder-dev.workers.dev/verify-65a6b9c1-d330-45a7-b13d-e7200b171057"
